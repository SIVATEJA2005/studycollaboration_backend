# Correct JDBC URL
# The URL should only contain the host, port, and database name
# Updated to common Supabase Pooler port 6543
spring.datasource.url=${supabase_url}
spring.datasource.username=${supabase_username}
spring.datasource.password=${supabase_password}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
# Optional: Spring Boot 3+ detects the dialect automatically, you can keep or remove this
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

